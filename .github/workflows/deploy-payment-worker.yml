name: Deploy payment Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "reduniq-worker/**"
      - ".github/workflows/deploy-payment-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Reject incomplete payment configuration
        shell: bash
        run: |
          if ! grep -q '"PAYMENTS_ENABLED": "false"' reduniq-worker/wrangler.jsonc; then
            echo "Deployments must keep the server-side payment switch disabled until sandbox approval."
            exit 1
          fi
          if ! grep -q '"COMMERCE_ENABLED": "false"' reduniq-worker/wrangler.jsonc; then
            echo "Deployments must keep commerce disabled until staging verification is complete."
            exit 1
          fi
      - name: Verify Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Required Cloudflare repository secrets are not installed."
            exit 1
          fi
      - name: Apply production hardening migration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: reduniq-worker
          command: d1 migrations apply rival-praxis-invoices --remote
      - name: Deploy Worker and custom domain
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: reduniq-worker
          command: deploy
