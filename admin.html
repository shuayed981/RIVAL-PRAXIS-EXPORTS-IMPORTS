<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Commerce Desk | RIVAL PRAXIS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-page"><main class="admin-main"><section class="admin-login" id="admin-login"><p class="eyebrow">Protected area</p><h1>Commerce Desk</h1><p>Enter the private administrator token stored in your password manager.</p><form id="login-form"><input id="admin-token" type="password" minlength="32" autocomplete="current-password" placeholder="Administrator token" required><button class="btn">Open dashboard</button></form><p id="login-message"></p></section><section id="dashboard" hidden><div class="admin-head"><div><p class="eyebrow">RIVAL PRAXIS</p><h1>Commerce Desk</h1></div><button id="refresh" class="btn secondary-action">Refresh</button></div><div class="admin-grid"><section class="admin-card"><h2>Create confirmed quotation</h2><form id="quote-form"><label>Request reference<input name="requestReference" required></label><div class="money-grid"><label>Subtotal EUR<input name="subtotal" type="number" min="0" step="0.01" required></label><label>VAT EUR<input name="tax" type="number" min="0" step="0.01" required></label><label>Shipping EUR<input name="shipping" type="number" min="0" step="0.01" required></label><label>Total EUR<input name="total" type="number" min="1" step="0.01" required></label></div><label>Expiry date<input name="expiresAt" type="date" required></label><button class="btn">Generate and email quote</button><p class="form-result" id="quote-result"></p></form></section><section class="admin-card"><h2>Update order status</h2><form id="status-form"><label>Order reference<input name="orderReference" required></label><label>Status<select name="status"><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</o
